name: Bug report
description: Report a reproducible problem in T&N Context Control
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve T&N Context Control.
        Before posting, remove API keys, tokens, private conversation text, usernames, and local file paths from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 0.2.4
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options:
        - Claude Code
        - Codex
        - Cline
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Run...
        3. See...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Do not include secrets, conversation content, usernames, or local paths.
      render: text
